org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Reuse task outputs between builds; the CI cache keeps this directory between runs.
org.gradle.caching=true
# AGP 9 (#19). Both flags are explicit: when one is missing, the Flutter migrator adds it back as false.
# Built-in Kotlin stays off because in_app_review and objectbox_flutter_libs still apply the Kotlin Gradle Plugin,
# which AGP rejects with built-in Kotlin on. The app itself no longer applies it. Turn on when both plugins migrate.
android.builtInKotlin=false
# The new DSL stays off: the Flutter Gradle plugin of Flutter 3.47.4 cannot apply to it yet
# (ApplicationExtensionImpl cannot be cast to AbstractAppExtension). Turn on after a Flutter update.
android.newDsl=false
